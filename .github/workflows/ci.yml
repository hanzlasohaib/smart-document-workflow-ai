name: CI
on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: "ci-test-secret"
      DATABASE_URL: "sqlite+pysqlite:///:memory:"
      UPLOAD_DIR: "./uploads_ci"
      STORAGE_BACKEND: "local"
      CONFIDENCE_THRESHOLD: "0.70"
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      CORS_ORIGINS: "http://localhost:3000"
      LOG_FORMAT: "text"
      AUTH_RATE_LIMIT_REQUESTS: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      - name: Lint
        run: ruff check .
      - name: Run tests
        run: pytest -q
      - name: Alembic upgrade dry-run (empty DB)
        env:
          DATABASE_URL: "sqlite+pysqlite:///./ci_alembic.db"
        run: |
          rm -f ./ci_alembic.db
          alembic upgrade head
          alembic current | grep -E "004_admin_otp_challenges|head"
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Smoke
        run: npm run smoke
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000/api/v1"
          API_INTERNAL_URL: "http://localhost:8000/api/v1"
        run: npm run build
  docker:
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t sdw-api:ci ./backend
      - name: Build web image
        run: docker build -t sdw-web:ci ./frontend