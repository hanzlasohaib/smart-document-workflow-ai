# Local / parity stack (PAS-06): web + API + PostgreSQL
# 1. cp backend/.env.example backend/.env  (set SECRET_KEY at minimum)
# 2. docker compose up --build
# 3. Optional admin: docker compose exec api python -m scripts.seed_admin
# Web: http://localhost:3000  API: http://localhost:8000

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sdw
      POSTGRES_PASSWORD: sdw
      POSTGRES_DB: smart_docs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdw -d smart_docs"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
      DATABASE_URL: postgresql://sdw:sdw@db:5432/smart_docs
      UPLOAD_DIR: /app/uploads
      STORAGE_BACKEND: local
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      CONFIDENCE_THRESHOLD: "0.70"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-local}
      AUTH_RATE_LIMIT_REQUESTS: ${AUTH_RATE_LIMIT_REQUESTS:-20}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
    volumes:
      - uploads:/app/uploads
      - ./backend/document_classifier.pkl:/app/document_classifier.pkl:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      API_INTERNAL_URL: http://api:8000/api/v1
      COOKIE_SECURE: "false"
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
